name: Static repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Check syntax, retained notebook outputs, portability and documentation
        run: python tools/check_repository.py
      - name: Install the locked linter only
        run: python -m pip install ruff==0.16.8
      - name: Lint Python and notebook source
        run: ruff check src tests tools notebooks
      - name: Check formatting
        run: ruff format --check src tests tools notebooks
